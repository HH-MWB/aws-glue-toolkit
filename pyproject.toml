[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "aws-glue-toolkit"
version = "0.4.0"
description = "A streamlined CLI utility designed to simplify the AWS Glue development lifecycle."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HH-MWB", email = "h.hong@mail.com" }]
keywords = [
    "aws",
    "cli",
    "docker",
    "etl",
    "glue",
    "spark",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "cyclopts>=4,<5",
    "packaging>=24,<26",
    "pip>=22.2,<27",
    "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/HH-MWB/aws-glue-toolkit"
Issues = "https://github.com/HH-MWB/aws-glue-toolkit/issues"
Changelog = "https://github.com/HH-MWB/aws-glue-toolkit/releases"
PyPI = "https://pypi.org/project/aws-glue-toolkit/"

[project.scripts]
gtk = "aws_glue_toolkit.cli:app"

[dependency-groups]
dev = [
    "pre-commit",
]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
strict = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pylint.design]
exclude-too-few-public-methods = ["pydantic.*"]
max-statements = 10

[tool.pylint.format]
max-line-length = 79

[tool.ruff]
line-length = 79
target-version = "py311"
fix = true
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # No per-file copyright headers in this project
    "D203", # Incompatible with D211 (no-blank-line-before-class)
    "D213", # Incompatible with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-statements = 10
