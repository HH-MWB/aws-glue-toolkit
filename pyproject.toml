[project]
name = "aws-glue-toolkit"
version = "0.0.0"
description = "A streamlined CLI utility designed to simplify the AWS Glue development lifecycle."
readme = "README.md"
authors = [
    { name = "HH-MWB", email = "h.hong@mail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[dependency-groups]
dev = [
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
strict = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unimported-reveal",
    "unused-awaitable",
]

[tool.pylint.format]
max-line-length = 79

[tool.ruff]
line-length = 79
fix = true
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # Incompatible with D211 (no-blank-line-before-class)
    "D213", # Incompatible with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.mccabe]
max-complexity = 5
